<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HTTP to Fetch / Curl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Lightened + higher-contrast palette for readability */
    --bg: #0B0C10;
    --panel: #101116;
    --line: #262832;
    --text: #F5F6FA;
    --dim: #9AA0AE;
    --dimmer: #565A66;
    --ink: #7C8CFF;
    --accent: #4CE28C;
    --amber: #F5D06B;
    --red: #FF6B7F;
    --cyan: #7CEEE8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    display:flex;
    flex-direction:column;
  }

  .bar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .bar > .div{
    width:1px;
    align-self:stretch;
    background:var(--line);
  }
  .chip{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;
    height:18px;
    border:1px solid var(--red);
    border-radius:3px;
    color:var(--red);
    font-weight:700;
    font-size:12px;
    margin-right:8px;
    flex-shrink:0;
  }
  .mark{
    display:flex;
    align-items:center;
    font-weight:700;
    font-size:13.5px;
    color:var(--ink);
    letter-spacing:-0.01em;
    margin-right:auto;
  }
  .mark span{ color:var(--dim); }

  .tabs{
    display:flex;
    border:1px solid var(--line);
    border-radius:5px;
    overflow:hidden;
  }
  .tabs button{
    background:transparent;
    border:none;
    color:var(--dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:600;
    padding:6px 12px;
    cursor:pointer;
  }
  .tabs button + button{ border-left:1px solid var(--line); }
  .tabs button.active{ background:var(--accent); color:#08170A; font-weight:700; }

  label.switch-row{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--dim);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    user-select:none;
  }
  .sw{
    position:relative;
    width:30px;
    height:17px;
    flex-shrink:0;
  }
  .sw input{ opacity:0; width:0; height:0; position:absolute; }
  .sw .trk{
    position:absolute; inset:0;
    background:#1F2129;
    border:1px solid var(--line);
    border-radius:999px;
    transition:.12s;
  }
  .sw .trk::before{
    content:"";
    position:absolute;
    height:11px; width:11px;
    left:2px; top:2px;
    background:var(--dimmer);
    border-radius:50%;
    transition:.12s;
  }
  .sw input:checked + .trk{ border-color:var(--amber); background:rgba(245,208,107,0.12); }
  .sw input:checked + .trk::before{ transform:translateX(13px); background:var(--amber); }

  button.go{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    background:var(--accent);
    color:#08170A;
    border:none;
    border-radius:6px;
    padding:7px 14px;
    cursor:pointer;
  }
  button.go:hover{ filter:brightness(1.06); }

  main{
    flex:1;
    display:flex;
    min-height:0;
  }
  @media (max-width: 860px){ main{ flex-direction:column; } }

  .col{
    display:flex;
    flex-direction:column;
    min-height:0;
    min-width:0;
  }
  #leftCol{ flex:1 1 50%; }
  #rightCol{ flex:1 1 50%; }
  @media (max-width: 860px){
    #leftCol, #rightCol{ flex:1 1 auto !important; }
  }

  /* Draggable divider between the two columns */
  .resizer{
    width:6px;
    flex:0 0 6px;
    background:var(--line);
    cursor:col-resize;
    position:relative;
  }
  .resizer::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:2px; height:28px;
    background:var(--dim);
    border-radius:2px;
    transform:translate(-50%,-50%);
  }
  .resizer:hover, .resizer.dragging{ background:var(--ink); }
  .resizer:hover::after, .resizer.dragging::after{ background:var(--bg); }
  @media (max-width: 860px){
    .resizer{ width:100%; height:6px; flex:0 0 6px; cursor:row-resize; }
    .resizer::after{ width:28px; height:2px; }
  }

  .col-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 14px;
    color:var(--dim);
    font-size:11px;
    font-weight:600;
    letter-spacing:0.06em;
    border-bottom:1px solid var(--line);
  }
  .col-head button.copy{
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:5px;
    cursor:pointer;
  }
  .col-head button.copy.on{ color:var(--accent); border-color:var(--accent); }

  textarea{
    flex:1;
    min-height:0;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    line-height:1.7;
    padding:14px;
  }
  textarea::placeholder{ color:var(--dim); }

  .strip{
    display:flex;
    border-bottom:1px solid var(--line);
    font-size:11px;
    color:var(--dim);
    font-weight:600;
  }
  .strip span{
    padding:8px 12px;
    border-right:1px solid var(--line);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .strip span:last-child{ border-right:none; flex:1; }
  .badge{
    font-weight:700;
    font-size:10px;
    padding:1px 6px;
    border-radius:4px;
  }
  .b-GET{ background:rgba(76,226,140,0.16); color:var(--accent); }
  .b-POST{ background:rgba(245,208,107,0.16); color:var(--amber); }
  .b-PUT{ background:rgba(124,238,232,0.16); color:var(--cyan); }
  .b-PATCH{ background:rgba(124,140,255,0.18); color:var(--ink); }
  .b-DELETE{ background:rgba(255,107,127,0.16); color:var(--red); }
  .b-DEFAULT{ background:rgba(154,160,174,0.16); color:var(--dim); }

  pre{
    margin:0;
    flex:1;
    min-height:0;
    overflow:auto;
    padding:14px;
    line-height:1.7;
    white-space:pre;
    outline:none;
    cursor:text;
  }
  pre:focus{ background:rgba(255,255,255,0.02); }
  pre.empty{ color:var(--dim); }
  .tok-kw{ color:var(--ink); font-weight:600; }
  .tok-str{ color:var(--cyan); }
  .tok-key{ color:var(--amber); }
  .tok-punc{ color:var(--dim); }
  .tok-com{ color:var(--dimmer); }
</style>
</head>
<body>

<div class="bar">
  <span class="mark"><span class="chip">ƒ</span>fetch<span>()</span></span>
  <div class="div"></div>
  <label class="switch-row">
    <span class="sw"><input type="checkbox" id="cookieToggle"><span class="trk"></span></span>
    cookie
  </label>
  <div class="div"></div>
  <button class="go" id="genBtn">generate</button>
</div>

<main>
  <div class="col" id="leftCol">
    <div class="col-head"><span>raw request</span><span></span></div>
    <textarea id="rawInput" spellcheck="false" placeholder="GET /path HTTP/1.1
Host: example.com
Authorization: Bearer xyz"></textarea>
  </div>

  <div class="resizer" id="resizer"></div>

  <div class="col" id="rightCol">
    <div class="strip" id="strip" style="display:none;">
      <span id="cMethod"></span>
      <span id="cUrl"></span>
      <span id="cHeaders"></span>
    </div>
    <div class="col-head">
      <div class="tabs">
        <button id="outFetch" class="active">fetch</button>
        <button id="outCurl">curl</button>
      </div>
      <button class="copy" id="copyBtn">copy</button>
    </div>
    <pre id="output" class="empty" contenteditable="true" spellcheck="false">—</pre>
  </div>
</main>

<script>
const rawInput   = document.getElementById('rawInput');
const genBtn     = document.getElementById('genBtn');
const cookieToggle = document.getElementById('cookieToggle');
const output     = document.getElementById('output');
const copyBtn    = document.getElementById('copyBtn');
const strip      = document.getElementById('strip');
const outFetch   = document.getElementById('outFetch');
const outCurl    = document.getElementById('outCurl');

let outFormat = 'fetch';

outFetch.addEventListener('click', () => setFormat('fetch'));
outCurl.addEventListener('click', () => setFormat('curl'));

function setFormat(f){
  outFormat = f;
  outFetch.classList.toggle('active', f === 'fetch');
  outCurl.classList.toggle('active', f === 'curl');
  generate();
}

// exact fetch-spec forbidden request headers (cookie handled separately via toggle)
const FORBIDDEN_EXACT = new Set([
  'accept-charset','accept-encoding','access-control-request-headers',
  'access-control-request-method','connection','content-length','cookie2',
  'date','dnt','expect','host','keep-alive','origin','referer',
  'set-cookie','set-cookie2','te','trailer','transfer-encoding','upgrade','via',
  ':authority',':method',':path',':scheme',':status'
]);
function isForbidden(name){
  const lk = name.toLowerCase();
  if(FORBIDDEN_EXACT.has(lk)) return true;
  if(lk.startsWith('proxy-')) return true;
  if(lk.startsWith('sec-')) return true;
  return false;
}

function parseRawHttp(raw){
  const normalized = raw.replace(/\r\n/g, '\n').replace(/^\uFEFF/, '');
  const lines = normalized.split('\n');
  let idx = 0;
  while(idx < lines.length && lines[idx].trim() === '') idx++;
  const requestLine = (lines[idx] || '').trim();
  const parts = requestLine.split(/\s+/);
  const method = (parts[0] || 'GET').toUpperCase();
  const path = parts[1] || '/';

  idx++;
  const headers = [];
  let host = '';
  for(; idx < lines.length; idx++){
    const line = lines[idx];
    if(line.trim() === ''){ idx++; break; }
    const sep = line.indexOf(':');
    if(sep === -1) continue;
    const key = line.slice(0, sep).trim();
    const value = line.slice(sep+1).trim();
    if(key.toLowerCase() === 'host') host = value;
    headers.push([key, value]);
  }
  const body = lines.slice(idx).join('\n').trim();

  let url = path;
  if(!/^https?:\/\//i.test(path)){
    url = (host ? 'https://' + host : '') + (path.startsWith('/') ? path : '/' + path);
  }
  return { method, url, headers, body };
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function methodClass(m){
  return ['GET','POST','PUT','PATCH','DELETE'].includes(m) ? 'b-' + m : 'b-DEFAULT';
}

function filterHeaders(headers, includeCookie, literalCookie){
  const filtered = [];
  let hadCookie = false;
  headers.forEach(([k,v]) => {
    if(k.toLowerCase() === 'cookie'){
      hadCookie = true;
      if(includeCookie && literalCookie) filtered.push([k,v]);
      return;
    }
    if(isForbidden(k)) return;
    filtered.push([k,v]);
  });
  return { filtered, hadCookie };
}

function render(parsed, includeCookie){
  const { method, url, headers, body } = parsed;
  const { filtered, hadCookie } = filterHeaders(headers, includeCookie, false);

  const hasBody = !!body && method !== 'GET' && method !== 'HEAD';
  let bodyBlock = '', bodyIsJson = false;
  if(hasBody){
    try{
      const parsedJson = JSON.parse(body);
      bodyBlock = JSON.stringify(parsedJson, null, 2).split('\n').map((l,i)=> i===0 ? l : '  ' + l).join('\n');
      bodyIsJson = true;
    }catch(e){
      bodyBlock = JSON.stringify(body);
    }
  }
  const useCredentials = hadCookie && includeCookie;

  let html = '';
  html += `<span class="tok-kw">fetch</span><span class="tok-punc">(</span><span class="tok-str">${esc(JSON.stringify(url))}</span><span class="tok-punc">, {</span>\n`;
  html += `  <span class="tok-key">method</span><span class="tok-punc">:</span> <span class="tok-str">${esc(JSON.stringify(method))}</span><span class="tok-punc">,</span>\n`;
  html += `  <span class="tok-key">headers</span><span class="tok-punc">: {</span>\n`;
  filtered.forEach(([k,v], i) => {
    const comma = i < filtered.length - 1 ? ',' : '';
    html += `    <span class="tok-str">${esc(JSON.stringify(k))}</span><span class="tok-punc">:</span> <span class="tok-str">${esc(JSON.stringify(v))}</span><span class="tok-punc">${comma}</span>\n`;
  });
  html += `  <span class="tok-punc">}</span><span class="tok-punc">${(useCredentials || hasBody) ? ',' : ''}</span>\n`;

  if(useCredentials){
    html += `  <span class="tok-key">credentials</span><span class="tok-punc">:</span> <span class="tok-str">"include"</span><span class="tok-punc">${hasBody ? ',' : ''}</span>\n`;
  }

  if(hasBody){
    if(bodyIsJson){
      html += `  <span class="tok-key">body</span><span class="tok-punc">:</span> <span class="tok-kw">JSON.stringify</span><span class="tok-punc">(</span>${esc(bodyBlock)}<span class="tok-punc">)</span>\n`;
    } else {
      html += `  <span class="tok-key">body</span><span class="tok-punc">:</span> <span class="tok-str">${esc(bodyBlock)}</span>\n`;
    }
  }
  html += `<span class="tok-punc">});</span>`;

  return { html, method, url, filtered };
}

function renderCurl(parsed, includeCookie){
  const { method, url, headers, body } = parsed;
  const { filtered } = filterHeaders(headers, includeCookie, true);
  const hasBody = !!body && method !== 'GET' && method !== 'HEAD';

  let html = `<span class="tok-kw">curl</span> <span class="tok-str">${esc("'" + url + "'")}</span>`;
  if(method !== 'GET'){
    html += ` \\\n  <span class="tok-punc">-X</span> <span class="tok-str">${esc(method)}</span>`;
  }
  filtered.forEach(([k,v]) => {
    html += ` \\\n  <span class="tok-punc">-H</span> <span class="tok-str">${esc("'" + k + ': ' + v + "'")}</span>`;
  });
  if(hasBody){
    html += ` \\\n  <span class="tok-punc">--data-raw</span> <span class="tok-str">${esc("'" + body.replace(/'/g, "'\\''") + "'")}</span>`;
  }

  return { html, method, url, filtered };
}

function generate(){
  const raw = rawInput.value;
  if(!raw.trim()){
    output.className = 'empty';
    output.textContent = '—';
    strip.style.display = 'none';
    console.log('[http-to-fetch] no input, nothing generated');
    return;
  }
  const parsed = parseRawHttp(raw);
  const result = outFormat === 'fetch'
    ? render(parsed, cookieToggle.checked)
    : renderCurl(parsed, cookieToggle.checked);

  document.getElementById('cMethod').innerHTML = `<span class="badge ${methodClass(result.method)}">${result.method}</span>`;
  document.getElementById('cUrl').textContent = result.url || '(no url)';
  document.getElementById('cHeaders').textContent = result.filtered.length + ' hdr';
  strip.style.display = 'flex';

  output.className = '';
  output.innerHTML = result.html;

  // Log the generated output + a plain-text version for easy inspection/debugging
  console.log('[http-to-fetch] parsed request:', parsed);
  console.log('[http-to-fetch] generated ' + outFormat + ':\n' + output.innerText);
}

genBtn.addEventListener('click', generate);
cookieToggle.addEventListener('change', generate);

copyBtn.addEventListener('click', () => {
  const text = output.innerText;
  if(!text || text === '—') return;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = 'copied';
    copyBtn.classList.add('on');
    console.log('[http-to-fetch] copied output to clipboard');
    setTimeout(() => { copyBtn.textContent = 'copy'; copyBtn.classList.remove('on'); }, 1200);
  });
});

// ---- Draggable divider (left/right resizable panes) ----
(function(){
  const resizer = document.getElementById('resizer');
  const leftCol = document.getElementById('leftCol');
  const rightCol = document.getElementById('rightCol');
  const main = document.querySelector('main');
  let dragging = false;

  function isStacked(){
    return window.matchMedia('(max-width: 860px)').matches;
  }

  function onPointerMove(e){
    if(!dragging) return;
    const rect = main.getBoundingClientRect();
    if(isStacked()){
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      const pct = Math.min(80, Math.max(20, (y / rect.height) * 100));
      leftCol.style.flex = `0 0 ${pct}%`;
      rightCol.style.flex = `1 1 auto`;
    } else {
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const pct = Math.min(80, Math.max(20, (x / rect.width) * 100));
      leftCol.style.flex = `0 0 ${pct}%`;
      rightCol.style.flex = `1 1 auto`;
    }
  }

  function stopDrag(){
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.userSelect = '';
  }

  resizer.addEventListener('mousedown', () => {
    dragging = true;
    resizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
  });
  resizer.addEventListener('touchstart', () => {
    dragging = true;
    resizer.classList.add('dragging');
  }, { passive: true });

  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('touchmove', onPointerMove, { passive: true });
  window.addEventListener('mouseup', stopDrag);
  window.addEventListener('touchend', stopDrag);
})();
</script>
</body>
</html>
